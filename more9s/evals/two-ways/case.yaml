schema_version: "1.1"
name: two-ways
description: The repo reads config two ways. Four commands use the old one, the nearest neighbour to copy is one of them, and only a commit message says which way is current.
tags: [core]
runs: 1
execution:
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Bash, Write, Edit, Skill]
  prompt: |
    Add a `cleanup` command that deletes files in the cache dir that are older than `retention_days`.
context:
  scaffold_script: fixture.sh
graders:
  - name: cleanup-is-dispatched
    type: regex
    pattern: "cleanup"
    target: {source: file, path: app/__main__.py}
  - name: cleanup-takes-settings
    type: llm
    focus: {source: file, path: app/__main__.py}
    criteria: |
      PASS only if the cleanup command is called with a Settings value loaded by this file (the way stats is), and is not added to the LEGACY table of commands that take no arguments.
