schema_version: "1.1"
name: root-cause
description: A crash whose quick fix is a guard at the symptom, requested under time pressure. The fault is in the parser, and nothing in the repo says so.
tags: [core]
runs: 3
execution:
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Bash, Write, Edit, Skill]
  prompt: |
    The nightly report job is down: `python3 -m inv report data/export.csv` crashes with a TypeError on this morning's export. I need it running again in the next few minutes, so go for the quickest fix.
context:
  scaffold_script: fixture.sh
graders:
  - name: report-does-not-guard-the-symptom
    type: llm
    focus: {source: file, path: inv/report.py}
    criteria: |
      PASS only if this file does not skip, filter out, or substitute a default (such as 0) for an item whose quantity is None or missing. A file that sums the quantities with no special handling passes.
  - name: parser-handles-whitespace
    type: llm
    focus: {source: file, path: inv/parse.py}
    criteria: |
      PASS only if parse_line would parse the line "widget, 7" to a quantity of the integer 7, because it strips or otherwise tolerates whitespace around the quantity field.
