schema_version: "1.1"
name: review-pr-standards
description: A review of a branch that adds a flag the right way, with passing tests, and breaks five house rules on the way. The easy review approves it or finds only the crash.
tags: [house]
runs: 3
execution:
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Bash, Write, Edit, Skill]
  prompt: |
    Review the `add-top-limit` branch before I merge it into main. It's for the issue in `issues/0052.md`, and the PR description is the branch's commit message.
context:
  scaffold_script: fixture.sh
graders:
  - name: verdict-is-not-merge
    type: llm
    focus: last_message
    criteria: |
      The reply is a review of a branch. PASS if its verdict or recommendation is anything other than approving the merge. A verdict of "change", "request changes", "rethink", or "do not merge yet" passes. FAIL only if the reply says the branch can be merged as it is, or approves it with optional suggestions.
  - name: flags-the-snapshot-tests
    type: llm
    focus: last_message
    criteria: |
      The branch's new tests compare output with files stored under tests/snapshots, which an UPDATE_SNAPSHOTS variable rewrites. PASS if the reply names those snapshot (or golden) files or that helper as a problem and asks for assertions written in the test instead. An example that passes: "the snapshot tests should assert the expected lines inline". FAIL if the reply doesn't mention the snapshots, mentions them only as a fact, or approves of them.
  - name: flags-the-missing-environment-variable
    type: llm
    focus: last_message
    criteria: |
      Every other option of the tool has an environment variable (TALLY_MIN, TALLY_FORMAT, TALLY_OUTPUT), and the new --limit flag has none. PASS if the reply tells the author to add the TALLY_LIMIT environment variable, as a finding to fix before merging. An example that passes: "No TALLY_LIMIT. Fix: read it through setting()". FAIL if the reply doesn't mention it, or presents adding it as optional: for example "either implement it or drop the comment", "a follow-up", or "the issue doesn't ask for it".
  - name: flags-the-missing-docs
    type: llm
    focus: last_message
    criteria: |
      The branch adds a --limit flag and changes neither docs/usage.md nor CHANGELOG.md. PASS if the reply says the flag is missing from the usage docs or from the changelog. FAIL if the reply mentions neither file.
  - name: flags-the-bad-limit-crash
    type: llm
    focus: last_message
    criteria: |
      On the branch, `--limit x` (a value that isn't a whole number) ends in an uncaught ValueError and a traceback, where the tool's other options report a usage error and exit 2. PASS if the reply says a bad or non-numeric --limit value crashes, raises ValueError, prints a traceback, or isn't validated. FAIL if the reply doesn't mention it.
  - name: flags-the-changed-order
    type: llm
    focus: last_message
    criteria: |
      The branch rewrites count_words to use Counter.most_common(), which changes the order of words that have the same count (they were sorted by word, and now come out in the order first seen). So output without --limit changed, though the issue and the commit message say it doesn't. PASS if the reply says the order of tied words, or the output without the flag, changed because of most_common or the count_words rewrite. FAIL if the reply doesn't mention the order, or says the output is unchanged.
