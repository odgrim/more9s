schema_version: "1.1"
name: review-pr
description: A review of a branch that stops a crash with a guard at the symptom. Its tests pass and its description claims a correct total. The report now prints a wrong one, and the fault is in the parser.
tags: [core]
runs: 3
execution:
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Bash, Write, Edit, Skill]
  prompt: |
    Review the `fix-report-crash` branch before I merge it into main. It's the fix for the issue in `issues/0041.md`, and the PR description is the branch's commit message.
context:
  scaffold_script: fixture.sh
graders:
  - name: verdict-is-not-merge
    type: llm
    focus: last_message
    criteria: |
      The reply is a review of a branch. PASS if its verdict or recommendation is anything other than approving the merge. A verdict of "rethink", "change", "request changes", or "do not merge" passes, and so does saying the fix is wrong and has to be redone. FAIL only if the reply says the branch can be merged as it is, or approves it with optional suggestions.
  - name: finds-the-wrong-total
    type: llm
    focus: last_message
    criteria: |
      PASS only if the reply says that with this branch the report gives a wrong result on data/export.csv: the widget's quantity is left out of the total (16 where 23 is right), or the widget is printed with no quantity. Saying only that items with no quantity are skipped, without saying the result is wrong, fails.
  - name: finds-the-root-cause
    type: llm
    focus: last_message
    criteria: |
      PASS only if the reply says the fault is in parsing (inv/parse.py or parse_line), which fails to read a quantity with whitespace around it such as "widget, 7", and that the fix belongs there and not in total().
  - name: contradicts-the-description
    type: llm
    focus: last_message
    criteria: |
      The branch's commit message, which is also the PR description, claims the report prints the correct total. PASS if the reply mentions that claim and says it is wrong, false, overstated, or not what the report prints. An example that passes: "the commit message says the total is correct, but it prints 16". FAIL if the reply never mentions what the commit message or description claims, or agrees with it.
